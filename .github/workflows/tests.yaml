---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "33 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - { go-version: stable }
          - { go-version-file: go.mod }
        deps:
          - locked
          - latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go.go-version }}
          go-version-file: ${{ matrix.go.go-version-file }}

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d3565f64e59130f1fd713440276f7d3e11079b88

      - name: Install jj
        run: brew install jj

      - name: Run tests
        run: |
          if [ "${{ matrix.deps }}" = "latest" ]; then
            go get -u -t ./...
          fi
          go test -v -race ./...

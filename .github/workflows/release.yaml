---
name: goreleaser

on:
  push:
    tags:
      - v*.*.*

jobs:
  goreleaser:
    permissions:
      id-token: write
      contents: write
    name: Run GoReleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Place GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" > /tmp/privkey.asc
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Place AUR key
        run: |
          echo "$AUR_KEY" > /tmp/aur_key
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_UPDATE_TOKEN: ${{ secrets.PACKAGE_UPDATE_TOKEN }}
          AUR_KEY: /tmp/aur_key
          NFPM_PASSPHRASE: ${{ secrets.NFPM_PASSPHRASE }}
          GPG_KEY_PATH: /tmp/privkey.asc
